<!DOCTYPE html>
<html>
<body style="background:#f1f5f9; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh;">
    <form method="POST" style="background:white; padding:40px; border-radius:10px; width:300px; box-shadow:0 10px 15px rgba(0,0,0,0.1)">
        <h2>Login</h2>
        <input type="email" name="email" placeholder="Email" required style="width:100%; margin-bottom:15px; padding:10px;"><br>
        <input type="password" name="password" placeholder="Password" required style="width:100%; margin-bottom:15px; padding:10px;"><br>
        <button type="submit" style="width:100%; background:#2563eb; color:white; border:none; padding:10px; cursor:pointer;">Login</button>
        <p>New? <a href="/register">Register</a></p>
    </form>
</body>
</html>
